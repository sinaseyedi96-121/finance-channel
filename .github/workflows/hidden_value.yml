name: Hidden Value (weekly)

on:
  schedule:
    - cron: '0 14 * * 3'    # Wednesday ~10:00 ET — undervalued + overlooked essentials
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run but do not publish
        type: boolean
        required: false
        default: false
      force:
        description: Ignore the Wednesday weekday gate
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: finance-hidden-value
  cancel-in-progress: false

jobs:
  hidden-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hidden-value
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python main.py --mode hidden_value ${DRY_RUN_FLAG} ${FORCE_FLAG}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json posts_log.jsonl
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Update hidden-value state [skip ci]"
          git push || (git fetch origin main && git rebase origin/main && git push)
